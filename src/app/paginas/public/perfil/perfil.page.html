<div class="auth">
  <div class="box">
    <h1>Mi perfil</h1>
    <p class="sub">{{ email }}</p>

    @if (mensaje) { <p class="aviso" role="status">{{ mensaje }}</p> }
    @if (error) { <p class="err" role="alert">{{ error }}</p> }

    <form (ngSubmit)="guardarPerfil()" class="box-in">
      <label>Nombre <input name="nombre" [(ngModel)]="nombre" /></label>
      <label>Apellido <input name="apellido" [(ngModel)]="apellido" /></label>
      <button type="submit" class="btn" [disabled]="guardando">Guardar cambios</button>
    </form>

    <hr />

    <form (ngSubmit)="cambiarPassword()" class="box-in">
      <h2>Cambiar contraseña</h2>
      <label>Contraseña actual <input type="password" name="actual" [(ngModel)]="actual" autocomplete="current-password" /></label>
      <label>Nueva contraseña <input type="password" name="nueva" [(ngModel)]="nueva" autocomplete="new-password" /></label>
      <button type="submit" class="btn" [disabled]="guardando || !actual || !nueva">Actualizar contraseña</button>
    </form>

    <p class="alt"><a routerLink="/mis-reservas">Ver mis reservas</a></p>
  </div>
</div>
