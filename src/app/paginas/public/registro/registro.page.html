<div class="auth">
  <form class="box" (ngSubmit)="crear()" novalidate>
    <h1>Crea tu cuenta</h1>
    <p class="sub">Guarda tus reservas, favoritos y opiniones en un solo lugar.</p>

    <label>Nombre
      <input name="nombre" [(ngModel)]="nombre" autocomplete="given-name" required />
    </label>
    <label>Apellido
      <input name="apellido" [(ngModel)]="apellido" autocomplete="family-name" required />
    </label>
    <label>Correo electrónico
      <input type="email" name="email" [(ngModel)]="email" autocomplete="email" required />
    </label>
    <label>Contraseña <span class="hint">(mínimo 8 caracteres)</span>
      <input type="password" name="password" [(ngModel)]="password" autocomplete="new-password" required />
    </label>
    @if (passwordDebil) {
      <p class="aviso">Usa al menos 8 caracteres.</p>
    }

    @if (error) {
      <p class="err" role="alert">{{ error }}</p>
    }

    <button type="submit" class="btn" [disabled]="cargando">{{ cargando ? 'Creando…' : 'Crear cuenta' }}</button>
    <p class="alt">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
  </form>
</div>
