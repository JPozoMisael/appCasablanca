<div class="auth">
  <form class="box" (ngSubmit)="entrar()" novalidate>
    <h1>Inicia sesión</h1>
    <p class="sub">Gestiona tus reservas o accede al panel de tu alojamiento.</p>

    @if (sesionExpirada) {
      <p class="aviso" role="status">Tu sesión expiró. Vuelve a iniciar sesión.</p>
    }

    <label>Correo electrónico
      <input type="email" name="email" [(ngModel)]="email" autocomplete="email" required />
    </label>

    <label>Contraseña
      <span class="pw">
        <input [type]="verPassword ? 'text' : 'password'" name="password" [(ngModel)]="password" autocomplete="current-password" required />
        <button type="button" (click)="verPassword = !verPassword" [attr.aria-label]="verPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
          {{ verPassword ? 'Ocultar' : 'Ver' }}
        </button>
      </span>
    </label>

    @if (error) {
      <p class="err" role="alert">{{ error }}</p>
    }

    <button type="submit" class="btn" [disabled]="cargando">{{ cargando ? 'Entrando…' : 'Iniciar sesión' }}</button>

    <p class="alt">¿No tienes cuenta? <a routerLink="/registro">Créala gratis</a></p>
    <p class="alt">¿Reservaste sin cuenta? <a routerLink="/consultar-reserva">Consulta tu reserva</a></p>
  </form>
</div>
