<div class="page">

  <div class="header">
    <h1>Habitaciones disponibles</h1>
    <p>Encuentra la mejor opción para tu estadía</p>
  </div>

  <div class="list">

    <div *ngFor="let h of habitaciones" class="card">

      <div class="img">
        <img [src]="h.imagen">
      </div>

      <div class="info">
        <h2>Habitación {{ h.numero }}</h2>

        <div class="features">
          <div class="feature">
            <ion-icon name="people-outline"></ion-icon>
            {{ h.capacidad }}
          </div>

          <div class="feature">
            <ion-icon name="bed-outline"></ion-icon>
            {{ h.camas }}
          </div>
        </div>
      </div>

      <div class="price">
        <div class="amount">
          ${{ h.precio }}
        </div>

        <ion-button>
          Ver disponibilidad
        </ion-button>
      </div>

    </div>

  </div>

</div>
