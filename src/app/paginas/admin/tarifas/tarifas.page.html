<ion-content class="ion-padding">
  <div class="tarifas-header">
    <div>
      <h1>Gestión de tarifas</h1>
      <p>Precios por temporada y tipo de habitación</p>
    </div>
    <button class="btn-primary" (click)="abrirModal()">
      <ion-icon name="add-circle-outline"></ion-icon>
      Nueva tarifa
    </button>
  </div>

  <!-- Filtros -->
  <div class="filters">
    <div class="search-box">
      <ion-icon name="search-outline"></ion-icon>
      <input type="text" placeholder="Buscar por tipo de habitación..." [(ngModel)]="searchTerm">
    </div>
  </div>

  <!-- Tabla -->
  <div class="table-container">
    <table class="tarifas-table">
      <thead>
        <tr>
          <th>Tipo habitación</th>
          <th>Temporada</th>
          <th>Precio / noche</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let t of tarifasFiltradas()">
          <td><strong>{{ t.tipo }}</strong></td>
          <td>{{ t.temporada }}</td>
          <td class="price">${{ t.precio }}</td>
          <td><span class="status-badge" [class.active]="t.estado === 'activo'">{{ t.estado === 'activo' ? 'Activa' : 'Inactiva' }}</span></td>
          <td class="actions">
            <button class="icon-btn" (click)="editar(t)"><ion-icon name="create-outline"></ion-icon></button>
            <button class="icon-btn danger" (click)="eliminar(t)"><ion-icon name="trash-outline"></ion-icon></button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Modal -->
  <div class="modal" *ngIf="modalAbierto" (click)="cerrarModal()">
    <div class="modal-content" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h3>{{ editando ? 'Editar tarifa' : 'Nueva tarifa' }}</h3>
        <button class="close-btn" (click)="cerrarModal()"><ion-icon name="close-outline"></ion-icon></button>
      </div>
      <div class="modal-body">
        <div class="field">
          <label>Tipo de habitación</label>
          <select [(ngModel)]="formData.tipo">
            <option value="Simple">Simple</option>
            <option value="Doble">Doble</option>
            <option value="Triple">Triple</option>
            <option value="Suite">Suite</option>
          </select>
        </div>
        <div class="field">
          <label>Temporada</label>
          <select [(ngModel)]="formData.temporada">
            <option value="Baja">Baja</option>
            <option value="Media">Media</option>
            <option value="Alta">Alta</option>
          </select>
        </div>
        <div class="field">
          <label>Precio por noche ($)</label>
          <input type="number" [(ngModel)]="formData.precio">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" (click)="cerrarModal()">Cancelar</button>
        <button class="btn-save" (click)="guardar()">Guardar</button>
      </div>
    </div>
  </div>
</ion-content>
