<ion-app>
  <ion-content
    class="public-shell"
    scrollEvents="true"
    (ionScroll)="onScroll($event)">

    <div class="page-wrapper">

      <!-- HEADER -->
      <app-header [hiddenOnScroll]="headerHidden"></app-header>

      <!-- CONTENIDO -->
      <div class="public-container">
        <router-outlet></router-outlet>
      </div>

      <!-- FOOTER -->
      <footer class="public-footer">
        <div class="footer-inner">
          <div class="footer-left">
            <div class="footer-title">Salinas Booking</div>
            <div class="footer-subtitle">Hoteles, hosterías y cabañas del cantón Salinas, Ecuador</div>
          </div>
          <nav class="footer-links" aria-label="Pie de página">
            <a routerLink="/buscar">Alojamientos</a>
            <a routerLink="/consultar-reserva">Consultar reserva</a>
            <a routerLink="/login">Acceso para hoteles</a>
          </nav>
          <div class="footer-meta">© {{ currentYear }} Salinas Booking</div>
        </div>
      </footer>

    </div>

  </ion-content>
</ion-app>
