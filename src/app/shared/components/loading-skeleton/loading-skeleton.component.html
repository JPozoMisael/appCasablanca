<div class="skeleton" [class.card-mode]="mode === 'card'" [class.list-mode]="mode === 'list'" [class.grid-mode]="mode === 'grid'">

  <!-- MODO TARJETA (por defecto) -->
  <ng-container *ngIf="mode === 'card'">
    <div class="skeleton-card" *ngFor="let i of [].constructor(rows)">
      <div class="skeleton-img" [style.height.px]="imageHeight"></div>
      <div class="skeleton-body">
        <div class="skeleton-line w60"></div>
        <div class="skeleton-line w40"></div>
        <div class="skeleton-line w80"></div>
        <div class="skeleton-line w50"></div>
        <div class="skeleton-line w30"></div>
      </div>
    </div>
  </ng-container>

  <!-- MODO LISTA -->
  <ng-container *ngIf="mode === 'list'">
    <div class="skeleton-list-item" *ngFor="let i of [].constructor(rows)">
      <div class="skeleton-avatar"></div>
      <div class="skeleton-list-body">
        <div class="skeleton-line w60"></div>
        <div class="skeleton-line w40"></div>
        <div class="skeleton-line w80"></div>
      </div>
    </div>
  </ng-container>

  <!-- MODO GRID (para habitaciones) -->
  <ng-container *ngIf="mode === 'grid'">
    <div class="skeleton-grid" [style.grid-template-columns]="gridColumns">
      <div class="skeleton-grid-item" *ngFor="let i of [].constructor(gridRows)">
        <div class="skeleton-img" [style.height.px]="imageHeight"></div>
        <div class="skeleton-body">
          <div class="skeleton-line w70"></div>
          <div class="skeleton-line w50"></div>
          <div class="skeleton-line w60"></div>
        </div>
      </div>
    </div>
  </ng-container>

  <!-- MODO TABLA (para admin) -->
  <ng-container *ngIf="mode === 'table'">
    <div class="skeleton-table">
      <div class="skeleton-table-header">
        <div class="skeleton-line w20" *ngFor="let i of [].constructor(5)"></div>
      </div>
      <div class="skeleton-table-row" *ngFor="let i of [].constructor(rows)">
        <div class="skeleton-line w20" *ngFor="let i of [].constructor(5)"></div>
      </div>
    </div>
  </ng-container>

  <!-- MODO DETALLE (para página de hotel/habitación) -->
  <ng-container *ngIf="mode === 'detail'">
    <div class="skeleton-detail">
      <div class="skeleton-detail-img" [style.height.px]="imageHeight"></div>
      <div class="skeleton-detail-body">
        <div class="skeleton-line w80"></div>
        <div class="skeleton-line w60"></div>
        <div class="skeleton-line w100"></div>
        <div class="skeleton-line w90"></div>
        <div class="skeleton-line w70"></div>
      </div>
    </div>
  </ng-container>

  <!-- MODO PERFIL -->
  <ng-container *ngIf="mode === 'profile'">
    <div class="skeleton-profile">
      <div class="skeleton-avatar large"></div>
      <div class="skeleton-line w50"></div>
      <div class="skeleton-line w40"></div>
      <div class="skeleton-line w80"></div>
    </div>
  </ng-container>

</div>
