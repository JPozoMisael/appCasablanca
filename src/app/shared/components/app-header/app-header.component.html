<header class="bhdr" [class.hide]="hiddenOnScroll">

  <div class="wrap">

    <!-- MOBILE MENU BUTTON -->
    <button class="menu-btn" (click)="toggleMenu()">
      <ion-icon name="menu-outline"></ion-icon>
    </button>

    <!-- BRAND -->
    <a class="brand" routerLink="/inicio">

      <div class="logo">{{ logoText }}</div>

      <div class="txt">
        <div class="t">{{ title }}</div>
        <div class="s">
          <ion-icon name="location-outline"></ion-icon>
          {{ subtitle }}
        </div>
      </div>

    </a>

    <!-- NAV DESKTOP -->
    <nav class="nav">

      <a routerLink="/inicio"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: true }">
        Inicio
      </a>

      <a routerLink="/inicio#sucursales">
        Sucursales
      </a>

      <a routerLink="/ofertas">
        Ofertas
      </a>

    </nav>

    <!-- ACTIONS -->
    <div class="actions">

      <a class="reserve-btn" routerLink="/inicio">
        Reservar ahora
      </a>

      <a class="login-btn" routerLink="/login">
        <ion-icon name="person-outline"></ion-icon>
        Iniciar sesión
      </a>

    </div>

  </div>

</header>


<!-- MOBILE DRAWER -->
<div class="drawer" [class.open]="menuOpen">

  <div class="drawer-content">

    <a routerLink="/inicio" (click)="closeMenu()">Inicio</a>

    <a routerLink="/inicio#sucursales" (click)="closeMenu()">
      Sucursales
    </a>

    <a routerLink="/ofertas" (click)="closeMenu()">Ofertas</a>

    <a routerLink="/login" (click)="closeMenu()">
      Iniciar sesión
    </a>

  </div>

</div>
