<header class="bhdr" [class.hide]="hiddenOnScroll">

  <div class="wrap">

    <!-- BRAND -->
    <a class="brand" routerLink="/inicio">

      <div class="logo">
        {{ logoText }}
      </div>

      <div class="txt">

        <div class="t">
          {{ title }}
        </div>

        <div class="s">
          <ion-icon name="location-outline"></ion-icon>
          {{ subtitle }}
        </div>

      </div>

    </a>

    <!-- NAV DESKTOP -->
    <nav class="nav">

      <a
        routerLink="/inicio"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <ion-icon name="home-outline"></ion-icon>
        Inicio
      </a>

      <a routerLink="/inicio#sucursales">
        <ion-icon name="business-outline"></ion-icon>
        Sucursales
      </a>

      <a routerLink="/habitaciones">
        <ion-icon name="bed-outline"></ion-icon>
        Habitaciones
      </a>

      <a routerLink="/ofertas">
        <ion-icon name="pricetag-outline"></ion-icon>
        Ofertas
      </a>

    </nav>

    <!-- ACTIONS (Login/User) -->
    <div class="actions">

      <!-- Usuario NO logueado -->
      <ng-container *ngIf="!isLoggedIn">
        <a class="login-btn" routerLink="/login">
          <ion-icon name="person-outline"></ion-icon>
          Iniciar sesión
        </a>
      </ng-container>

      <!-- Usuario logueado -->
      <ng-container *ngIf="isLoggedIn">
        <div class="user-menu" (click)="toggleUserMenu()">
          <div class="user-avatar">
            {{ userInitials }}
          </div>
          <div class="user-dropdown" *ngIf="userMenuOpen">
            <a routerLink="/perfil" (click)="closeAllMenus()">
              <ion-icon name="person-outline"></ion-icon>
              Mi perfil
            </a>
            <a routerLink="/mis-reservas" (click)="closeAllMenus()">
              <ion-icon name="calendar-outline"></ion-icon>
              Mis reservas
            </a>
            <a *ngIf="isAdmin" routerLink="/admin" (click)="closeAllMenus()">
              <ion-icon name="shield-outline"></ion-icon>
              Panel admin
            </a>
            <button class="logout-btn" (click)="logout()">
              <ion-icon name="log-out-outline"></ion-icon>
              Cerrar sesión
            </button>
          </div>
        </div>
      </ng-container>

    </div>

    <!-- MOBILE BUTTON -->
    <button class="menu-btn" (click)="toggleMenu()">
      <ion-icon
        [name]="menuOpen ? 'close-outline' : 'menu-outline'">
      </ion-icon>
    </button>

  </div>

</header>

<!-- MOBILE DRAWER -->
<div class="drawer" [class.open]="menuOpen">

  <div class="drawer-content">

    <a routerLink="/inicio" (click)="closeMenu()">
      <ion-icon name="home-outline"></ion-icon>
      Inicio
    </a>

    <a routerLink="/inicio#sucursales" (click)="closeMenu()">
      <ion-icon name="business-outline"></ion-icon>
      Sucursales
    </a>

    <a routerLink="/habitaciones" (click)="closeMenu()">
      <ion-icon name="bed-outline"></ion-icon>
      Habitaciones
    </a>

    <a routerLink="/ofertas" (click)="closeMenu()">
      <ion-icon name="pricetag-outline"></ion-icon>
      Ofertas
    </a>

    <!-- Usuario NO logueado -->
    <ng-container *ngIf="!isLoggedIn">
      <a routerLink="/login" (click)="closeMenu()">
        <ion-icon name="person-outline"></ion-icon>
        Iniciar sesión
      </a>
    </ng-container>

    <!-- Usuario logueado -->
    <ng-container *ngIf="isLoggedIn">
      <a routerLink="/perfil" (click)="closeMenu()">
        <ion-icon name="person-outline"></ion-icon>
        Mi perfil
      </a>
      <a routerLink="/mis-reservas" (click)="closeMenu()">
        <ion-icon name="calendar-outline"></ion-icon>
        Mis reservas
      </a>
      <a *ngIf="isAdmin" routerLink="/admin" (click)="closeMenu()">
        <ion-icon name="shield-outline"></ion-icon>
        Panel admin
      </a>
      <button class="logout-btn-mobile" (click)="logout()">
        <ion-icon name="log-out-outline"></ion-icon>
        Cerrar sesión
      </button>
    </ng-container>

  </div>

</div>
