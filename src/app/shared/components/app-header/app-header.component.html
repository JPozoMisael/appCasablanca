<header class="bhdr" [class.hide]="hiddenOnScroll">

  <div class="wrap">

    <!-- LOGO + BRAND -->
    <a class="brand" routerLink="/inicio">
      <div class="logo">{{ logoText }}</div>
      <div class="txt">
        <div class="t">{{ title }}</div>
        <div class="s">
          <ion-icon name="location-outline"></ion-icon>
          {{ subtitle }}
        </div>
      </div>
    </a>

    <!-- NAV -->
    <nav class="nav">
      <a routerLink="/inicio"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: true }">
        Inicio
      </a>

      <a routerLink="/inicio#sucursales">
        Sucursales
      </a>

      <a routerLink="/habitaciones">
        Habitaciones
      </a>

      <a routerLink="/ofertas">
        Ofertas
      </a>
    </nav>

    <!-- ACTIONS -->
    <div class="actions">

      <a class="login-btn" routerLink="/login">
        Iniciar sesión
      </a>

      <a class="reserve-btn" routerLink="/hotel/palmeras/habitaciones">
        Reservar ahora
      </a>

    </div>

    <!-- MOBILE BUTTON -->
    <button class="menu-btn" (click)="toggleMenu()">
      <ion-icon name="menu-outline"></ion-icon>
    </button>

  </div>

</header>

<!-- MOBILE MENU -->
<div class="drawer" [class.open]="menuOpen">
  <div class="drawer-content">

    <a routerLink="/inicio" (click)="closeMenu()">Inicio</a>
    <a routerLink="/inicio#sucursales" (click)="closeMenu()">Sucursales</a>
    <a routerLink="/habitaciones" (click)="closeMenu()">Habitaciones</a>
    <a routerLink="/ofertas" (click)="closeMenu()">Ofertas</a>

    <a routerLink="/login" (click)="closeMenu()">Iniciar sesión</a>

    <a routerLink="/hotel/palmeras/habitaciones"
       class="reserve-drawer"
       (click)="closeMenu()">
      Reservar ahora
    </a>

  </div>
</div>
