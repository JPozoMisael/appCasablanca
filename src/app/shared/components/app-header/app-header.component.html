<header class="bhdr" [class.hide]="hiddenOnScroll">

  <div class="wrap">

    <!-- BRAND -->
    <a class="brand" routerLink="/inicio">

      <div class="logo">
        {{ logoText }}
      </div>

      <div class="txt">

        <div class="t">
          {{ title }}
        </div>

        <div class="s">
          <ion-icon name="location-outline"></ion-icon>
          {{ subtitle }}
        </div>

      </div>

    </a>

    <!-- NAV -->
    <nav class="nav">

      <a
        routerLink="/inicio"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <ion-icon name="home-outline"></ion-icon>
        Inicio
      </a>

      <a routerLink="/inicio#sucursales">
        <ion-icon name="business-outline"></ion-icon>
        Sucursales
      </a>

      <a routerLink="/habitaciones">
        <ion-icon name="bed-outline"></ion-icon>
        Habitaciones
      </a>

      <a routerLink="/ofertas">
        <ion-icon name="pricetag-outline"></ion-icon>
        Ofertas
      </a>

    </nav>

    <!-- ACTIONS -->
    <div class="actions">

      <a class="login-btn" routerLink="/login">
        <ion-icon name="person-outline"></ion-icon>
        Iniciar sesión
      </a>

    </div>

    <!-- MOBILE -->
    <button class="menu-btn" (click)="toggleMenu()">
      <ion-icon
        [name]="menuOpen ? 'close-outline' : 'menu-outline'">
      </ion-icon>
    </button>

  </div>

</header>

<!-- MOBILE DRAWER -->
<div class="drawer" [class.open]="menuOpen">

  <div class="drawer-content">

    <a routerLink="/inicio" (click)="closeMenu()">
      Inicio
    </a>

    <a routerLink="/inicio#sucursales" (click)="closeMenu()">
      Sucursales
    </a>

    <a routerLink="/habitaciones" (click)="closeMenu()">
      Habitaciones
    </a>

    <a routerLink="/ofertas" (click)="closeMenu()">
      Ofertas
    </a>

    <a routerLink="/login" (click)="closeMenu()">
      Iniciar sesión
    </a>

  </div>

</div>
