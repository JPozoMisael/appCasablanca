<div class="bk-search" [class.disabled]="disabled">

  <div class="bk-bar">

    <!-- SUCURSAL -->
    <div class="bk-item" (click)="toggleBranch($event)">
      <div class="bk-label">
        <ion-icon name="location-outline"></ion-icon>
        Sucursal
      </div>
      <div class="bk-value-main">{{ branchLabel }}</div>

      <div
        class="bk-pop"
        *ngIf="branchOpen"
        (click)="$event.stopPropagation()">

        <div
          class="branch-card"
          *ngFor="let b of branches"
          (click)="onSelectBranch(b.id, $event)"
          [class.active]="branch === b.id">

          <div class="branch-info">
            <div class="branch-name">{{ b.name }}</div>
            <div class="branch-desc">{{ b.desc }}</div>
          </div>

          <div *ngIf="branch === b.id">
            <ion-icon name="checkmark-circle"></ion-icon>
          </div>

        </div>
      </div>
    </div>

    <!-- FECHAS -->
    <div class="bk-item" (click)="toggleDates($event)">
      <div class="bk-label">
        <ion-icon name="calendar-outline"></ion-icon>
        Fechas
      </div>

      <div class="bk-value-main">
        {{ checkIn ? (checkIn | date:'dd MMM') : 'Entrada' }}
        —
        {{ checkOut ? (checkOut | date:'dd MMM') : 'Salida' }}
      </div>

      <div
        class="bk-pop"
        *ngIf="datesOpen"
        (click)="$event.stopPropagation()">

        <app-calendar-picker
          [checkIn]="checkIn"
          [checkOut]="checkOut"
          (rangeChange)="onRangeChange($event)">
        </app-calendar-picker>

      </div>
    </div>

    <!-- HUÉSPEDES -->
    <div class="bk-item" (click)="toggleGuests($event)">
      <div class="bk-label">
        <ion-icon name="people-outline"></ion-icon>
        Huéspedes
      </div>

      <div class="bk-value-main">
        {{ getGuestsText() }}
      </div>

      <div
        class="bk-pop"
        *ngIf="guestsOpen"
        (click)="$event.stopPropagation()">

        <div class="guest-row">
          Adultos
          <button (click)="dec('adults')">-</button>
          {{ adults }}
          <button (click)="inc('adults')">+</button>
        </div>

        <div class="guest-row">
          Niños
          <button (click)="dec('children')">-</button>
          {{ children }}
          <button (click)="inc('children')">+</button>
        </div>

        <div class="guest-row">
          Habitaciones
          <button (click)="dec('rooms')">-</button>
          {{ rooms }}
          <button (click)="inc('rooms')">+</button>
        </div>

        <button (click)="togglePets()">
          Mascotas: {{ withPets ? 'Sí' : 'No' }}
        </button>

      </div>
    </div>

    <!-- BOTÓN -->
    <div class="bk-action">
      <ion-button
        class="bk-btn"
        expand="block"
        (click)="onSubmit()">

        <ion-icon slot="start" name="search-outline"></ion-icon>
        {{ buttonText }}
      </ion-button>
    </div>

  </div>

  <!-- BACKDROP -->
  <div
    class="bk-backdrop"
    *ngIf="branchOpen || datesOpen || guestsOpen"
    (click)="closeAll()">
  </div>

</div>
